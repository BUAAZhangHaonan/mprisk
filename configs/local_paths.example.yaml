schema_version: mprisk_local_paths_v1

# Copy this file to configs/local_paths.yaml and replace every example value
# with an absolute path on the current machine.  The runtime never searches
# for resources and never reads environment variables as path fallbacks.
roots:
  repo:
    project: /absolute/path/to/mprisk
  model:
    qwen3_vl_8b: /absolute/path/to/models/Qwen3-VL-8B-Instruct
  env:
    mind_py311: /absolute/path/to/conda/envs/mind-py311
  artifact:
    outputs: /absolute/path/to/mprisk/outputs
    complete_bundle: /absolute/path/to/taffc_complete_bundle
  external:
    source_delivery: /absolute/path/to/source/delivery
    target_delivery: /absolute/path/to/target/delivery
